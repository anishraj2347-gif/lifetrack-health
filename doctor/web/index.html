<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LifeTrack Clinic: patients who shared with you, prescriptions and private consult notes.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LT Clinic">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LifeTrack Clinic</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Local encryption for everything this page keeps in the browser. The
    // AES-256-GCM key is made here as non-extractable and kept in IndexedDB:
    // the page can use it but cannot read it out, and local storage on its
    // own is ciphertext. (Someone with the whole browser profile and its OS
    // account has the key too — so this is for the doctor's own device.)
    window.ltVault = (function () {
      var keyP = null;
      function db() {
        return new Promise(function (res, rej) {
          var r = indexedDB.open('lifetrack-doctor', 1);
          r.onupgradeneeded = function () { r.result.createObjectStore('keys'); };
          r.onsuccess = function () { res(r.result); };
          r.onerror = function () { rej(r.error); };
        });
      }
      function key() {
        if (keyP) return keyP;
        keyP = (async function () {
          var d = await db();
          var found = await new Promise(function (res, rej) {
            var q = d.transaction('keys', 'readonly').objectStore('keys').get('main');
            q.onsuccess = function () { res(q.result); };
            q.onerror = function () { rej(q.error); };
          });
          if (found) return found;
          var k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
          await new Promise(function (res, rej) {
            var t = d.transaction('keys', 'readwrite');
            t.objectStore('keys').put(k, 'main');
            t.oncomplete = res;
            t.onerror = function () { rej(t.error); };
          });
          return k;
        })();
        return keyP;
      }
      function toB64(u) {
        var s = '';
        for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
        return btoa(s);
      }
      function fromB64(b) {
        var s = atob(b), u = new Uint8Array(s.length);
        for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
        return u;
      }
      async function seal(text) {
        var k = await key();
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(text)));
        var out = new Uint8Array(12 + ct.length);
        out.set(iv);
        out.set(ct, 12);
        return 'lt1:' + toB64(out);
      }
      async function open(sealed) {
        if (sealed.indexOf('lt1:') !== 0) throw new Error('not sealed');
        var k = await key();
        var b = fromB64(sealed.slice(4));
        var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, k, b.slice(12));
        return new TextDecoder().decode(pt);
      }
      async function reset() {
        keyP = null;
        await new Promise(function (res) {
          var r = indexedDB.deleteDatabase('lifetrack-doctor');
          r.onsuccess = r.onerror = r.onblocked = function () { res(); };
        });
      }
      return { seal: seal, open: open, reset: reset };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
